net:
  proxy:
    # 代理相关信息
    - ip: 127.0.0.1
      port: 1080
      type: SOCKS

ai:
  maxNum:
    basic: 5 # 默认兜底策略
    wechat: 10 # 公众号用户
    star: 100 # 星球用户
    starTry: 30 # 星球用户
    invited: 0.1 # 被邀请
    inviteNum: 0.2 # 邀请人数执行策略
    starNumber: 4000 # 目前为 4000
  source: # 支持的AI模型
    - CHAT_GPT_3_5
    - CHAT_GPT_4
    - PAI_AI
    - XUN_FEI_AI

# chatgpt
chatgpt:
  main: CHAT_GPT_3_5
  conf:
    CHAT_GPT_3_5:
      keys:
        -
      proxy: true # 表示走上面的代理进行访问
      apiHost: https://api.openai.com/
      timeOut: 900
      maxToken: 3000
    CHAT_GPT_4:
      keys:
        -
      proxy: true
      apiHost: https://api.openai.com/
      timeOut: 900
      maxToken: 200000
  number:
    # 普通用户
    normal: 50
    vip: 100



# 讯飞AI - OpenAI 兼容接口配置
xunfei:
  apiHost: https://spark-api-open.xf-yun.com/x2/chat/completions
  apiKey: "geMabFscRClgqfLYlzKL:IiRotpmeOpAEdCxKXOYW"
  model: "spark-x"
  maxToken: 4096
  timeOut: 300
  proxy: false

# 文章 AI 解读功能配置（ai-interpret）
# 支持多模型，自动降级切换
ai-interpret:
  enabled: true
  max-daily-requests: 50
  models:
    - name: deepseek
      display-name: "DeepSeek V3"
      priority: 0
      api-host: "https://api.deepseek.com/v1/chat/completions"
      api-key: ${DEEPSEEK_API_KEY:sk-your-deepseek-key}
      model-name: deepseek-chat
      max-tokens: 4096
      timeout-seconds: 30
      enabled: true
    - name: kimi
      display-name: "月之暗面 Kimi"
      priority: 1
      api-host: "https://api.moonshot.cn/v1/chat/completions"
      api-key: ${KIMI_API_KEY:sk-your-kimi-key}
      model-name: moonshot-v1-8k
      max-tokens: 4096
      timeout-seconds: 30
      enabled: true
    - name: qwen
      display-name: "通义千问 Turbo"
      priority: 2
      api-host: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
      api-key: ${QWEN_API_KEY:sk-your-qwen-key}
      model-name: qwen-turbo
      max-tokens: 4096
      timeout-seconds: 30
      enabled: true